name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Validar dados e documentação gerada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar e conferir arquivos gerados
        run: python tools/gerar_docs.py --check
