name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Validar dados e documentação gerada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar e conferir arquivos gerados
        run: python tools/gerar_docs.py --check
      - name: Testar as regras do desenho (camadas, conexões e fluxos)
        run: python -m unittest discover -s tools -p "test_gerar_docs.py" -v
      - name: Testar ferramentas da editora
        run: python -m unittest discover -s tools/editora -v
      - name: Testar o motor financeiro dos negócios
        run: python -m unittest discover -s tools/negocios -v
      - name: Conferir os números gerados dos negócios
        run: python tools/negocios/gerar.py --check
      - name: Testar e conferir o portfólio de ofertas
        run: |
          python -m unittest discover -s tools/portfolio -v
          python tools/portfolio/portfolio.py --check
      - name: Testar e conferir o catálogo de softwares
        run: |
          python -m unittest discover -s tools/softwares -v
          python tools/softwares/softwares.py --check
      - name: Testar o kit de sites, o avaliador e as ferramentas do dia a dia
        run: |
          python tools/kitsites/gerar.py --check
          python tools/custos/custos.py --check
          python tools/recursos/recursos.py --check
          python tools/investimentos/investimentos.py docs --check
          python tools/carreira/certificacoes.py --check
          python tools/cockpit/gerar.py --check
          python tools/akita/akita.py docs --check
          python tools/nucleo/agenda.py rapido --check
          for d in kitsites avaliador radar organizar remoto financeiro fabrica ia custos recursos investimentos carreira roi sessao documentos seguranca jarvis construcao triagem nucleo cockpit akita professor vault sites recrutador; do python -m unittest discover -s tools/$d -v || exit 1; done
      - name: Testar o pipeline de conteúdo e conferir o roteiro de implantação
        run: |
          python -m unittest discover -s tools/conteudo -v
          python -m unittest discover -s tools/implantacao -v
          python -m unittest discover -s tools/acervo -v
          python tools/implantacao/gerar.py --check

  scripts:
    name: Validar scripts e Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning scripts/wsl/*.sh infra/automacao/*.sh infra/automacao/sql/*.sh os/instalar.sh os/amtech && shellcheck -s sh infra/pocketbase/entrada.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path scripts/windows -Settings PSScriptAnalyzerSettings.psd1 -Severity Error,Warning
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: Diagnóstico do Windows roda sem quebrar (dados vazios fora do Windows)
        shell: pwsh
        run: |
          ./scripts/windows/diagnostico.ps1 -Saida "$env:RUNNER_TEMP/diag"
          if (-not (Test-Path "$env:RUNNER_TEMP/diag/diagnostico.md")) { exit 1 }
      - name: Docker Compose da automação
        working-directory: infra/automacao
        env:
          METRICAS_SENHA: ci
          GRAFANA_DB_SENHA: ci
          GRAFANA_SENHA: ci
          N8N_CHAVE: ci
          AMTECH_DIR: /tmp/amtech
        run: docker compose config --quiet
      - name: Docker Compose da casa
        working-directory: infra/casa
        env:
          CASA_DIR: /tmp/casa
          PAPERLESS_SECRET: ci
        run: docker compose config --quiet
      - name: Docker Compose da IA e da rede
        env:
          LITELLM_MASTER_KEY: ci
        run: |
          docker compose -f infra/ia/compose.yaml config --quiet
          docker compose -f infra/rede/compose.yaml config --quiet
          docker compose -f infra/dados/compose.yaml config --quiet
          docker compose -f infra/lab-seguranca/compose.yaml config --quiet
          docker compose -f infra/lab-alvo/compose.yaml config --quiet
          JARVIS_DIR=/tmp/jarvis docker compose -f infra/jarvis/compose.yaml --profile zigbee --profile cameras config --quiet
      - name: Docker Compose da soberania e do PocketBase
        run: |
          cp infra/soberania/.env.example /tmp/soberania.env && sed -i 's/=$/=ci/' /tmp/soberania.env
          docker compose -f infra/soberania/compose.yaml --env-file /tmp/soberania.env --profile '*' config --quiet
          PB_VERSAO=1 LS_VERSAO=1 LITESTREAM_BUCKET=ci LITESTREAM_ENDPOINT=ci LITESTREAM_ACCESS_KEY_ID=ci LITESTREAM_SECRET_ACCESS_KEY=ci docker compose -f infra/pocketbase/compose.yaml config --quiet
