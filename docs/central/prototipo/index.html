<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central AMtech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* Layout: barra lateral escura fixa (navegação + estado) e área de trabalho clara; no celular, barra inferior e terminal em folha. */
:root{
  --paper:#F7F5F0; --surface:#FFFFFF; --ink:#13262B; --muted:#5B6B6E; --line:#DCD8CE;
  --aura:#0E3A45; --on-aura:#F7F5F0; --gold:#C08A3E; --gold-ink:#8A5E22; --aura-tint:#E2ECEC; --gold-tint:#F3E7D3;
  --ok:#2F7A4F; --ok-tint:#E3F1E8; --warn:#9A5B12; --warn-tint:#FBEBD2; --off:#8C4A4A; --off-tint:#F4E4E2;
  --void:#071317; --void-2:#0C2027; --void-3:#14303A; --void-ink:#E7EEEC; --void-muted:#8FA6A9; --void-accent:#7FC4C9; --void-gold:#E1B46A;
  --display:"Fraunces", Georgia, serif; --sans:"IBM Plex Sans", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B1A1E; --surface:#112429; --ink:#E9EEEC; --muted:#9AAEB0; --line:#24414A;
  --aura:#7FC4C9; --on-aura:#0B1A1E; --gold:#D9A85E; --gold-ink:#E3B877; --aura-tint:#163238; --gold-tint:#3A2D18;
  --ok:#7CCB9A; --ok-tint:#16301F; --warn:#E8B46A; --warn-tint:#3A2A12; --off:#E39C9C; --off-tint:#3A1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B1A1E; --surface:#112429; --ink:#E9EEEC; --muted:#9AAEB0; --line:#24414A;
  --aura:#7FC4C9; --on-aura:#0B1A1E; --gold:#D9A85E; --gold-ink:#E3B877; --aura-tint:#163238; --gold-tint:#3A2D18;
  --ok:#7CCB9A; --ok-tint:#16301F; --warn:#E8B46A; --warn-tint:#3A2A12; --off:#E39C9C; --off-tint:#3A1E1E; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--aura)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:236px 1fr;height:100%}
/* barra lateral */
.side{background:var(--void);color:var(--void-ink);display:flex;flex-direction:column;gap:14px;padding:18px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--void-3);display:grid;place-items:center;font:700 13px var(--mono);color:var(--void-gold)}
.brand b{font:700 18px/1 var(--display);letter-spacing:-.01em}
.brand small{display:block;font:500 11px var(--mono);color:var(--void-muted);margin-top:3px}
.seek{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--void-3);background:var(--void-2);color:var(--void-muted);cursor:pointer;text-align:left}
.seek kbd{margin-left:auto;font:500 11px var(--mono);border:1px solid var(--void-3);border-radius:5px;padding:1px 5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--void-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--void-2)}
.nav a[aria-current="page"]{background:var(--void-3);color:#fff}
.nav a[aria-current="page"] svg{color:var(--void-gold)}
.nav svg{width:18px;height:18px;color:var(--void-muted);flex:none}
.badge{margin-left:auto;min-width:20px;padding:0 6px;border-radius:10px;background:var(--void-gold);color:var(--void);font:600 11px/18px var(--mono);text-align:center}
.side .estado{margin-top:auto;border-top:1px solid var(--void-3);padding:12px 8px 0;font-size:12.5px;color:var(--void-muted);display:grid;gap:6px}
.side .estado b{color:var(--void-ink);font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--void-muted);margin-right:6px;vertical-align:1px}
.dot.ok{background:#7CCB9A}.dot.warn{background:#E8B46A}.dot.off{background:#E39C9C}
.linkbtn{background:none;border:0;padding:0;color:var(--void-accent);cursor:pointer;text-align:left;font-size:12.5px;text-decoration:underline}
/* área principal */
main{overflow:auto;padding:22px clamp(16px,3vw,36px) 120px}
.aviso{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font:500 12px var(--mono);color:var(--gold-ink);background:var(--gold-tint);border-radius:8px;padding:7px 12px;margin-bottom:18px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--gold-ink)}
h1{margin:2px 0 0;font:700 clamp(26px,4vw,34px)/1.1 var(--display);color:var(--aura);letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font:600 17px/1.3 var(--sans);text-wrap:balance}
h3{margin:0;font:600 15px/1.35 var(--sans)}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.wide{grid-column:1/-1}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:2px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:500}
.item .s{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--aura)}
.btn.pri{background:var(--aura);border-color:var(--aura);color:var(--on-aura)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1306}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn svg{width:15px;height:15px}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--mono);padding:4px 8px;border-radius:20px;background:var(--aura-tint);color:var(--aura);white-space:nowrap}
.pill.ok{background:var(--ok-tint);color:var(--ok)}.pill.warn{background:var(--warn-tint);color:var(--warn)}.pill.off{background:var(--off-tint);color:var(--off)}.pill.gold{background:var(--gold-tint);color:var(--gold-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--aura);color:var(--on-aura);border-color:var(--aura)}
.stripe{border-left:4px solid var(--line)}
.stripe.s5{border-left-color:var(--gold)}.stripe.merge{border-left-color:var(--aura)}.stripe.regra{border-left-color:var(--ok)}.stripe.compra{border-left-color:var(--off)}
input[type=text],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px}
textarea{min-height:84px;resize:vertical}
label.f{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:600 22px/1.1 var(--sans);font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:4px;background:var(--aura-tint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--aura);border-radius:4px}
.bar.gold i{background:var(--gold)}
.escada{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.degrau{border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12px;color:var(--muted);background:var(--surface)}
.degrau b{display:block;font:600 12px var(--mono);color:var(--ink)}
.degrau.on{border-color:var(--gold);background:var(--gold-tint);color:var(--ink)}
pre.out{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:400 12.5px/1.5 var(--mono);background:var(--aura-tint);border-radius:9px;padding:10px 12px;max-height:280px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font:500 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
.scroll-x{overflow-x:auto}
details.fase{border-top:1px solid var(--line)}
details.fase summary{list-style:none;display:grid;grid-template-columns:1fr 120px 56px;gap:12px;align-items:center;padding:10px 4px;cursor:pointer}
details.fase summary::-webkit-details-marker{display:none}
.passo{display:flex;gap:10px;align-items:flex-start;padding:7px 4px 7px 14px;font-size:14px}
.passo input{margin-top:4px;accent-color:var(--aura)}
.passo.feito .pt{text-decoration:line-through;color:var(--muted)}
.niveis{display:flex;gap:3px}
.niveis button{width:22px;height:8px;border-radius:3px;border:0;background:var(--aura-tint);cursor:pointer;padding:0}
.niveis button.on{background:var(--aura)}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}
.kbd{font:500 12px var(--mono);background:var(--aura-tint);padding:1px 6px;border-radius:5px}
/* terminal */
.term{position:fixed;right:0;bottom:0;left:236px;height:min(48vh,440px);background:var(--void);color:var(--void-ink);border-top:1px solid var(--void-3);display:none;flex-direction:column;z-index:20;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.term.open{display:flex}
.term header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--void-3);font:500 12.5px var(--mono);color:var(--void-muted)}
.term header b{color:var(--void-gold);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term header .btn{background:var(--void-2);border-color:var(--void-3);color:var(--void-ink)}
.term pre{flex:1;margin:0;overflow:auto;padding:12px 14px;font:400 12.5px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.term .cmd{color:var(--void-accent)}.term .nota{color:var(--void-gold)}
/* modal e paleta */
.veu{position:fixed;inset:0;background:rgba(7,19,23,.55);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 16px;z-index:40}
.veu.open{display:flex}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;width:min(560px,100%);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:80vh;overflow:auto}
.paleta{padding:0;gap:0}
.paleta input{border:0;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0;padding:15px 16px;font-size:16px;background:transparent}
.paleta .res{max-height:52vh;overflow:auto;padding:6px}
.res button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;align-items:baseline}
.res button[aria-selected="true"],.res button:hover{background:var(--aura-tint)}
.res .k{font:500 11px var(--mono);color:var(--gold-ink);width:72px;flex:none;text-transform:uppercase}
.res .x{color:var(--muted);font-size:12.5px;margin-left:auto;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--void);color:var(--void-ink);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;display:none;max-width:calc(100% - 32px)}
.toast.open{display:block}
/* celular */
.bottom{display:none}
.mtop{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .side{display:none}
  .side.drawer{display:flex;position:fixed;inset:0 25% 0 0;z-index:50;min-width:260px}
  .mtop{display:flex;align-items:center;gap:10px;background:var(--void);color:var(--void-ink);padding:10px 14px}
  .mtop b{font:700 17px var(--display)}
  .mtop .seek{width:auto;margin-left:auto;padding:7px 10px}
  main{padding:16px 16px 140px}
  .bottom{display:flex;background:var(--void);border-top:1px solid var(--void-3);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom a,.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--void-muted);text-decoration:none;font-size:11px;background:none;border:0;position:relative;padding:4px 0}
  .bottom a[aria-current="page"]{color:var(--void-gold)}
  .bottom svg{width:21px;height:21px}
  .bottom .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0;min-width:16px;font-size:10px;line-height:15px;padding:0 4px}
  .term{left:0;height:62vh;bottom:0}
  .grid{grid-template-columns:1fr}
  .escada{grid-template-columns:1fr 1fr}
  details.fase summary{grid-template-columns:1fr 64px 44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="app">
  <div class="mtop">

    <b>Central AMtech</b>
    <button class="seek" data-act="paleta" aria-label="Buscar ou rodar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4.3-4.3"/></svg>Buscar</button>
  </div>
  <aside class="side" id="side">

    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <div class="estado" id="estado"></div>
  </aside>
  <main id="main" tabindex="-1"></main>
  <nav class="bottom" id="bottom" aria-label="Seções principais"></nav>
</div>
<section class="term" id="term" aria-label="Terminal">

    <button class="btn sm" data-act="fechar-term">Fechar</button></header>

</section>
<div class="veu" id="veu"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

/* ---------- motor de decisão: porta fiel de tools/motor/motor.py com data/motor/regras.json ---------- */
const R = D.motor, VAZ = new Set(D.vazias);
const norm = s => String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").split(/\s+/).filter(Boolean).join(" ");
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function tem(t, lista){ const out=[], vistos=new Set(); for(const x of lista||[]){ const n=norm(x); if(!vistos.has(n) && new RegExp("(?<![a-z0-9])"+reEsc(n)+"(?![a-z0-9])").test(t)){ out.push(x); vistos.add(n) } } return out }
const palavras = s => (norm(s).match(/[a-z0-9]+/g)||[]).filter(p => p.length>2 && !VAZ.has(p));
function sensivel(p){ const s=R.sensivel; const m=tem(norm(p), s.palavras).map(x=>`palavra '${x}'`); for(const [k,rx] of Object.entries(s.padroes)){ try{ if(new RegExp(rx).test(p)) m.push("padrão de "+k) }catch(e){} } return m }
function catalogo(p){ const ps=new Set(palavras(p)); const out=[]; for(const c of D.catalogo){ const n=[...new Set(palavras(c.t))].filter(w=>ps.has(w)).length; if(n>=2) out.push(c.k==="rota"?`Rota '${c.t}': ${c.x}`:`Bloco '${c.t}' (${c.id}): ${c.x}`) } return out.slice(0,5) }
function tipoPedido(t){ let best="padrao", bn=0; for(const [k,ps] of Object.entries(R.tipos)){ const n=tem(t,ps).length; if(n>bn || (n===bn && n>0 && k>best)){ best=k; bn=n } } return bn?best:"padrao" }
function modelo(t, sens){ const m=R.modelos; if(sens || tem(t,m.local.quando).length) return m.local.destino; for(const k of ["forte","codigo"]) if(tem(t,m[k].quando).length) return m[k].destino; return m.padrao.destino }
function decidir(pedido){
  const t=norm(pedido), p=R.palavras, sens=sensivel(pedido), pronto=catalogo(pedido); let d, motivo, a;
  if((a=tem(t,p.voce)).length){ d=5; motivo="portão humano: "+a.join(", ") }
  else if(pronto.length){ d=1; motivo="já existe no setup" }
  else if((a=tem(t,p.codigo)).length){ d=2; motivo="regra escrevível: "+a.join(", "); const ag=tem(t,p.automacao); if(ag.length) motivo+=`; disparo por ${ag.join(", ")} (script + automação)` }
  else if((a=tem(t,p.automacao)).length){ d=3; motivo="evento ou horário: "+a.join(", ") }
  else if((a=tem(t,p.linguagem)).length){ d=4; motivo="linguagem: "+a.join(", ") }
  else { d=4; motivo="nenhuma regra casou; a IA interpreta e você confirma o formulário" }
  const tipo=tipoPedido(t), ent=R.entregaveis[tipo]||R.entregaveis.padrao||{entregavel:"",pronto:""};
  const destino = d===4 ? modelo(t, sens.length>0) : R.degraus[String(d)].quem;
  return {pedido, d, nome:R.degraus[String(d)].nome, destino, motivo, sens, pronto, tipo, ent};
}
function textoDecisao(r){
  let s=`Pedido: ${r.pedido}\n\n[DEGRAU ${r.d}] ${r.nome} → ${r.destino}\nPor quê: ${r.motivo}\n`;
  if(r.sens.length) s+=`Dado sensível (${r.sens.join(", ")}): ${R.sensivel.regra}\n`;
  if(r.pronto.length) s+=`\nJá no setup:\n  - ${r.pronto.join("\n  - ")}\n`;
  s+=`\nFormulário (confirme os três últimos campos):\n  TAREFA: ${r.pedido}\n  ENTREGÁVEL: ${r.ent.entregavel}\n  PRONTO QUANDO: ${r.ent.pronto}\n  CONFIRMAR COM VOCÊ: PARA QUE; ESCOPO (com número); PRONTO QUANDO`;
  return s;
}

/* ---------- terminal simulado ---------- */
let ultimoCmd = "";
function abrirTerm(cmd){ ultimoCmd=cmd; $("#term-cmd").textContent=cmd; $("#term-out").innerHTML=""; $("#term").classList.add("open") }
function escrever(texto, cls=""){ const pre=$("#term-out"); const linhas=String(texto).split("\n"); let i=0; clearInterval(escrever.h);
  escrever.h=setInterval(()=>{ const bloco=linhas.slice(i,i+3); i+=3; pre.insertAdjacentHTML("beforeend", bloco.map(l=>`<span class="${cls}">${esc(l)}</span>`).join("\n")+"\n"); pre.scrollTop=pre.scrollHeight; if(i>=linhas.length) clearInterval(escrever.h) }, 35) }
function rodar(nome, args=""){
  const cmd=`just ${nome}${args?" "+args:""}`.trim(); abrirTerm(cmd);
  const pre=$("#term-out"); pre.insertAdjacentHTML("beforeend",`<span class="cmd">$ ${esc(cmd)}</span>\n`);
  auditar(cmd, ["agora","decisoes","progresso","fila","tarefas","buscar","verificar","ligado","professor","livros","recrutador","motor","triagem","motor-relatorio","atritos","erros"].includes(nome)?"automático":"você");
  const chave=`${nome}${args?" "+args:""}`; let out=null;
  // receitas que mudam o estado da Central
  if(nome==="feito"){ args.split(/\s+/).filter(Boolean).forEach(id=>marcarPasso(id,true)); out=`Marcado como feito: ${args}`; }
  else if(nome==="pedir"){ out = pedir(args.replace(/^"|"$/g,""), "dev-setup") }
  else if(nome==="motor"){ out = textoDecisao(decidir(args.replace(/^"|"$/g,""))) }
  else if(nome==="lembrar"){ S.base.unshift({t:"nota",x:args.replace(/^"|"$/g,"")}); salvar(); out="Guardado na base do núcleo." }
  else if(nome==="buscar"){ const q=args.replace(/^"|"$/g,""); const b=[...S.base,...D.adrs].filter(x=>norm(x.x).includes(norm(q))); out=b.length?b.map(x=>`[${x.t}] ${x.x}`).join("\n"):"Nada na base sobre isso." }
  else if(nome==="tarefas"){ out=S.tarefas.filter(t=>!t.ok).map(t=>`#${t.id}  ${t.t}`).join("\n")||"Nenhuma tarefa aberta." }
  else if(nome==="fila"){ out="Claude disponível para a fila.\n"+S.fila.map(f=>`#${f.id}  ${f.st.padEnd(16)} ${f.motor.padEnd(16)} ${f.txt}`).join("\n") }
  else if(nome==="ligado"){ out="== Status\n"+FILA_SERV.map(([k])=>`  [${S.fserv[k]?"ok":"--"}]   ${k} ${S.fserv[k]?"no ar":"parado"}`).join("\n")+"\n  [ok]   LiteLLM em 127.0.0.1:4000" }
  else if(nome==="erro"||nome==="atrito"){ S.base.unshift({t:nome,x:args.replace(/^"|"$/g,"")}); salvar(); out=`Anotado no caderno de ${nome}s do vault.` }
  else if(D.saidas[chave]) out=D.saidas[chave];
  else { const k=Object.keys(D.saidas).find(k=>k===nome||k.startsWith(nome+" ")); if(k){ escrever(`(protótipo: mostrando a saída real de "just ${k}", capturada em ${D.gerado})`,"nota"); out=D.saidas[k] } }
  if(out==null) out=`(protótipo) No notebook esta receita roda de verdade. A Central mostra a saída aqui, linha a linha, enquanto o comando trabalha.\nReceita: ${(D.receitas.find(r=>r.n===nome)||{}).d||""}`;
  setTimeout(()=>escrever(out), 60);
  if(atual!=="comandos") desenhar(); else desenharNav();
}
function marcarPasso(id, v){ if(v) S.feitos[id]=true; else delete S.feitos[id]; salvar() }

/* ---------- fila ---------- */
function pedir(texto, repo){
  if(!texto.trim()) return "Escreva o pedido primeiro.";
  const m=texto.match(/^@([\w.-]+)/); if(m) repo=m[1];
  const r=decidir(texto), id=S.prox++;
  const f={id,txt:texto,repo,deg:r.d,motor:"-",st:"na fila"};
  if(r.d===5){ f.st="voltou para você"; f.motor="você"; S.aprov.unshift({id:"ap-p"+id,tipo:"pedido",t:texto,s:`Degrau 5 (${r.motivo}). O setup prepara, você decide.`,origem:`Pedido #${id}`}) }
  else if(r.d===1){ f.st="respondido"; f.motor="já existe" }
  else { f.motor = r.sens.length?"aider + Ollama (local)":"Claude Code"; setTimeout(()=>avancar(id,"trabalhando"),2200); setTimeout(()=>avancar(id,"PR em rascunho"),6500) }
  S.fila.push(f); auditar(`pedido #${id}: ${texto} → degrau ${r.d}`, "automático"); salvar();
  return textoDecisao(r) + `\n\nPedido #${id} ${f.st}.`;
}
function avancar(id, st){
  const f=S.fila.find(x=>x.id===id); if(!f) return; f.st=st;
  if(st==="PR em rascunho"){ S.aprov.unshift({id:"ap-pr"+id,tipo:"merge",t:`PR em rascunho: ${f.txt}`,s:`Ramo fila/${id} · feito por ${f.motor} · testes passando (simulado)`,origem:`Fila de pedidos #${id}`,diff:`+++ ramo fila/${id}\n+ (mudanças geradas para: ${f.txt})`,fila:id}); toast(`Pedido #${id} virou PR em rascunho. Aviso enviado ao Telegram (simulado).`) }
  auditar(`fila #${id}: ${st}`, "automático"); salvar(); if(["hoje","pedir","aprovar"].includes(atual)) desenhar(); else desenharNav();
}

function fecharModal(){ $("#veu").classList.remove("open") }
function prepararReceita(nome){
  const r=D.receitas.find(x=>x.n===nome); if(!r) return;
  if(!r.p.length && !r.c){ rodar(nome); return }
  modal(`<h2 class="mono">just ${esc(nome)}</h2><p class="muted">${esc(r.d)}</p>
    ${r.p.map((p,i)=>`<label class="f" for="arg${i}">${esc(p.n)}${p.var?" (pode ter várias palavras)":""}<input type="text" id="arg${i}" value="${esc(p.def||"")}" placeholder="${esc(p.n)}"></label>`).join("")}
    ${r.c?`<p class="pill warn" style="white-space:normal;line-height:1.4">Confirmação: ${esc(r.c)}</p>`:""}
    <div class="row" style="justify-content:flex-end"><button class="btn" data-act="fechar-modal">Cancelar</button><button class="btn ${r.c?"gold":"pri"}" data-act="confirmar-receita" data-r="${esc(nome)}">${r.c?"Confirmar e rodar":"Rodar"}</button></div>`);
}
const precisaAspas = (nome, i) => ["pedido","texto","comando"].includes((D.receitas.find(x=>x.n===nome)||{p:[]}).p[i]?.n);

/* ---------- paleta (Ctrl K) ---------- */
let pal=[], palSel=0;
function abrirPaleta(){ modal(`<div class="paleta" style="display:flex;flex-direction:column"><input id="pal-q" type="search" placeholder="Receita, tela, serviço, passo ou módulo… (Enter abre)" autocomplete="off"><div class="res" id="pal-res" role="listbox"></div></div>`); $("#modal").classList.add("paleta"); buscarPaleta("") }
function buscarPaleta(q){
  const n=norm(q), out=[];
  VIEWS.forEach(([id,t])=>out.push({k:"tela",t,x:"",go:()=>{location.hash=id}}));
  D.receitas.forEach(r=>out.push({k:"receita",t:"just "+r.n,x:r.d,go:()=>prepararReceita(r.n)}));
  SERVICOS.forEach(s=>out.push({k:"serviço",t:s.n,x:"127.0.0.1:"+s.p,go:()=>{location.hash="servicos"}}));
  D.modulos.forEach(m=>out.push({k:"estudo",t:m.t,x:m.id,go:()=>rodar("professor","aula "+m.id)}));
  D.fases.forEach(f=>f.ps.forEach(p=>out.push({k:"passo",t:p.t,x:p.id,go:()=>{filtros.meu=false;location.hash="roteiro"}})));
  D.ofertas.forEach(o=>out.push({k:"oferta",t:o.nome,x:o.proximo_passo,go:()=>{location.hash="empresas"}}));
  pal = n ? out.filter(o=>norm(o.t+" "+o.x).includes(n)).slice(0,30) : out.slice(0,9+12);
  if(n) pal.unshift({k:"pedir",t:`Pedir: “${q}”`,x:"manda para a fila",go:()=>{location.hash="pedir"; setTimeout(()=>{const t=$("#p-txt"); if(t){t.value=q; t.focus()}},50)}});
  palSel=0; desenharPaleta();
}
function desenharPaleta(){ $("#pal-res").innerHTML = pal.map((o,i)=>`<button role="option" aria-selected="${i===palSel}" data-act="pal" data-i="${i}"><span class="k">${esc(o.k)}</span><span>${esc(o.t)}</span><span class="x">${esc(o.x)}</span></button>`).join("") || '<p class="empty" style="padding:10px">Nada encontrado.</p>' }

/* ---------- ações ---------- */
const tirar = id => { const a=S.aprov.find(x=>x.id===id); S.aprov=S.aprov.filter(x=>x.id!==id); return a };
const ACOES = {
  drawer(){ $("#side").classList.toggle("drawer") },
  paleta: abrirPaleta,
  ir(el){ location.hash=el.dataset.v },
  restaurar(){ S=semente(); salvar(); desenhar(); toast("Exemplo restaurado.") },
  rodar(el){ rodar(el.dataset.r, el.dataset.a||"") },
  preparar(el){ prepararReceita(el.dataset.r) },
  "confirmar-receita"(el){ const nome=el.dataset.r; const vals=[...$("#modal").querySelectorAll("input")].map((i,k)=>{const v=i.value.trim(); return v&&precisaAspas(nome,k)?`"${v}"`:v}).filter(Boolean); fecharModal(); rodar(nome, vals.join(" ")) },
  "fechar-modal": fecharModal,
  "fechar-term"(){ $("#term").classList.remove("open") },
  async "copiar-cmd"(){ try{ await navigator.clipboard.writeText(ultimoCmd); toast("Comando copiado. Cole no terminal do Ubuntu.") }catch(e){ toast("O navegador não deixou copiar. Selecione o texto do terminal.") } },
  fav(el){ const r=el.dataset.r; S.favs=S.favs.includes(r)?S.favs.filter(x=>x!==r):[...S.favs,r]; salvar(); desenhar() },
  "f-aprov"(el){ filtros.aprov=el.dataset.v; desenhar() }, "f-area"(el){ filtros.area=el.dataset.v; desenhar() },
  "f-trilha"(el){ filtros.trilha=el.dataset.v; desenhar() }, "f-meu"(){ filtros.meu=!filtros.meu; desenhar() },
  "ver-diff"(el){ const a=S.aprov.find(x=>x.id===el.dataset.id); modal(`<h2>${esc(a.t)}</h2><pre class="out">${esc(a.diff||"")}</pre><div class="row" style="justify-content:flex-end"><button class="btn" data-act="fechar-modal">Fechar</button><button class="btn pri" data-act="aprovar" data-id="${a.id}">Aprovar o merge</button></div>`) },
  aprovar(el){ const a=S.aprov.find(x=>x.id===el.dataset.id); if(!a) return;
    modal(`<h2>Confirmar</h2><p>${esc(a.t)}</p><p class="muted" style="font-size:13.5px">Esta ação para no seu ok pela política do Núcleo. Fica registrada na auditoria.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="fechar-modal">Cancelar</button><button class="btn pri" data-act="aprovar-ok" data-id="${a.id}">Confirmar</button></div>`) },
  "aprovar-ok"(el){ const a=tirar(el.dataset.id); fecharModal(); if(!a) return;
    if(a.fila){ const f=S.fila.find(x=>x.id===a.fila); if(f) f.st="mesclado" }
    if(a.tipo==="compra") S.custo.gasto=S.custo.gasto; // compras saem do caixa pessoal, não do teto de IA
    auditar(`aprovou: ${a.t}`, "pede ok"); salvar(); desenhar(); toast("Aprovado e registrado.") },
  recusar(el){ const a=tirar(el.dataset.id); if(a){ auditar(`recusou: ${a.t}`, "pede ok"); salvar(); desenhar(); toast("Recusado. Fica anotado para não voltar igual.") } },
  adiar(el){ const i=S.aprov.findIndex(x=>x.id===el.dataset.id); if(i>-1){ S.aprov.push(S.aprov.splice(i,1)[0]); salvar(); desenhar(); toast("Foi para o fim da fila.") } },
  ajuste(el){ const a=S.aprov.find(x=>x.id===el.dataset.id); modal(`<h2>Pedir ajuste</h2><p class="muted">${esc(a.t)}</p><label class="f" for="aj">O que mudar?<textarea id="aj" placeholder="Ex.: o botão do menu precisa ficar à direita"></textarea></label><div class="row" style="justify-content:flex-end"><button class="btn" data-act="fechar-modal">Cancelar</button><button class="btn pri" data-act="ajuste-ok" data-id="${a.id}">Mandar de volta para a fila</button></div>`) },
  "ajuste-ok"(el){ const a=tirar(el.dataset.id); const txt=$("#aj").value.trim()||"ajuste"; fecharModal(); if(a&&a.fila){ const f=S.fila.find(x=>x.id===a.fila); if(f){ f.st="trabalhando"; setTimeout(()=>avancar(f.id,"PR em rascunho"),5000) } } auditar(`pediu ajuste: ${txt}`,"você"); salvar(); desenhar(); toast("Voltou para a fila com o seu ajuste.") },
  decidir(el){ const a=S.aprov.find(x=>x.id===el.dataset.id); modal(`<h2>${esc(a.t)}</h2><p class="muted" style="font-size:13.5px">${esc(a.s)}</p><label class="f" for="dec">Sua decisão (vai para o Núcleo)<textarea id="dec" placeholder="Ex.: Essencial R$ 900 + R$ 90/mês…"></textarea></label><div class="row" style="justify-content:flex-end"><button class="btn" data-act="fechar-modal">Cancelar</button><button class="btn pri" data-act="decidir-ok" data-id="${a.id}">Guardar e marcar feito</button></div>`) },
  "decidir-ok"(el){ const a=tirar(el.dataset.id); const txt=$("#dec").value.trim(); fecharModal(); if(!a) return; if(a.passo) marcarPasso(a.passo,true); S.base.unshift({t:"decisao",x:`${a.t}: ${txt||"(sem texto)"}`}); auditar(`decidiu: ${a.t}`,"só você"); salvar(); desenhar(); toast("Decisão guardada no Núcleo e passo marcado.") },
  "motor-ok"(el){ tirar(el.dataset.id); auditar("motor #1: deu certo (regra de três +1)","automático"); salvar(); desenhar(); toast("Anotado. Mais 2 iguais e isso vira script.") },
  "motor-refazer"(el){ tirar(el.dataset.id); auditar("motor #1: refazer","automático"); salvar(); desenhar(); toast("Anotado para refazer.") },
  feito(el){ marcarPasso(el.dataset.id,true); auditar(`just feito ${el.dataset.id}`,"você"); desenhar(); toast(`Passo ${el.dataset.id} feito.`) },
  passo(el){ marcarPasso(el.dataset.id, el.checked); auditar(`${el.checked?"feito":"desfez"} ${el.dataset.id}`,"você"); const d=el.closest("details"); desenhar(); if(d){ const id=el.dataset.id; const novo=[...document.querySelectorAll("details.fase")].find(x=>x.querySelector(`[data-id="${CSS.escape(id)}"]`)); if(novo) novo.open=true } },
  nivel(el){ const id=el.dataset.id, v=+el.dataset.v; S.niveis[id]=(S.niveis[id]===v)?v-1:v; auditar(`professor ${id}: ${NIVEIS[S.niveis[id]]}`,"você"); salvar(); desenhar() },
  anotar(el){ const i=$("#e-txt"); const t=i.value.trim(); if(!t){ i.focus(); return } rodar(el.dataset.v, `"${t}"`); i.value="" },
  tarefa(el){ const t=S.tarefas.find(x=>x.id==el.dataset.id); t.ok=el.checked; auditar(`tarefa ${t.ok?"feita":"reaberta"}: ${t.t}`,"você"); salvar(); desenhar() },
  serv(el){ const n=el.dataset.id; S.serv[n]=!S.serv[n]; const s=SERVICOS.find(x=>x.n===n); rodar("servico", `${s.c.split("/")[1]||n}  # ${S.serv[n]?"subir":"parar"} ${n}`); salvar(); desenhar() },
  fserv(el){ const k=el.dataset.id; S.fserv[k]=!S.fserv[k]; auditar(`${S.fserv[k]?"ligou":"parou"} ${k}`,"você"); salvar(); desenhar() },
  exemplo(el){ $("#p-txt").value=el.dataset.v; mostrarDegrau() },
  "so-motor"(){ mostrarDegrau() },
  pal(el){ const o=pal[+el.dataset.i]; fecharModal(); $("#modal").classList.remove("paleta"); o.go() }
};
function mostrarDegrau(){ const t=$("#p-txt").value.trim(); if(!t){ $("#p-txt").focus(); return } const r=decidir(t);
  document.querySelectorAll(".degrau").forEach(x=>x.classList.toggle("on", +x.dataset.d===r.d));
  $("#p-res").innerHTML=`<pre class="out">${esc(textoDecisao(r))}</pre>`; }
document.addEventListener("click", e => { const el=e.target.closest("[data-act]"); if(!el) return; const f=ACOES[el.dataset.act]; if(!f) return; if(el.tagName!=="INPUT") e.preventDefault(); f(el) });
document.addEventListener("submit", e => { e.preventDefault(); const id=e.target.id;
  if(id==="form-pedir"){ const t=$("#p-txt").value.trim(); if(!t){ $("#p-txt").focus(); return } const out=pedir(t, $("#p-repo").value); desenhar(); const res=$("#p-res"); if(res) res.innerHTML=`<pre class="out">${esc(out)}</pre>`; const r=decidir(t); document.querySelectorAll(".degrau").forEach(x=>x.classList.toggle("on", +x.dataset.d===r.d)); toast("Pedido na fila.") }
  if(id==="form-lembrar"){ const t=$("#l-txt").value.trim(); if(!t) return; S.base.unshift({t:$("#l-tipo").value,x:t}); auditar(`just lembrar "${t}"`,"você"); salvar(); desenhar(); toast("Guardado no Núcleo.") }
  if(id==="form-tarefa"){ const t=$("#t-txt").value.trim(); if(!t) return; S.tarefas.push({id:Date.now(),t,ok:false}); auditar(`tarefa nova: ${t}`,"você"); salvar(); desenhar() }
});
document.addEventListener("input", e => {
  if(e.target.id==="busca-cmd"){ filtros.busca=e.target.value; const pos=e.target.selectionStart; desenhar(); const i=$("#busca-cmd"); i.focus(); i.setSelectionRange(pos,pos) }
  if(e.target.id==="busca-nuc"){ filtros.nucleo=e.target.value; const pos=e.target.selectionStart; desenhar(); const i=$("#busca-nuc"); i.focus(); i.setSelectionRange(pos,pos) }
  if(e.target.id==="pal-q") buscarPaleta(e.target.value);
});
document.addEventListener("keydown", e => {
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); abrirPaleta(); return }
  if(e.key==="Escape"){ if($("#veu").classList.contains("open")){ fecharModal(); $("#modal").classList.remove("paleta") } else $("#term").classList.remove("open") }
  if(e.target.id==="pal-q"){ if(e.key==="ArrowDown"){ palSel=Math.min(pal.length-1,palSel+1); desenharPaleta(); e.preventDefault() } if(e.key==="ArrowUp"){ palSel=Math.max(0,palSel-1); desenharPaleta(); e.preventDefault() } if(e.key==="Enter"&&pal[palSel]){ const o=pal[palSel]; fecharModal(); $("#modal").classList.remove("paleta"); o.go() } }
});
$("#veu").addEventListener("click", e => { if(e.target.id==="veu"){ fecharModal(); $("#modal").classList.remove("paleta") } });
window.addEventListener("hashchange", ir);
ir();
</script>
</body>
</html>
