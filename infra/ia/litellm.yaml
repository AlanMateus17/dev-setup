# Nomes estáveis para os agentes; troque o modelo por trás sem mexer em nenhum agente.
model_list:
  - model_name: local
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://host.docker.internal:11434
  - model_name: rapido
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: forte
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gratis            # cota grátis do Gemini (AI Studio): nada sensível
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gpu-alugada        # vLLM numa GPU por hora (RunPod); só quando ligada
    litellm_params:
      model: openai/seu-modelo
      api_base: os.environ/VLLM_URL
router_settings:
  fallbacks:
    - forte: [rapido]
    - rapido: [gratis, local]
litellm_settings:
  max_budget: 20          # US$ por mês no total; passou, recusa
  budget_duration: 30d
